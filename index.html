    <style>
      body {
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* 
         OFF-SCREEN RENDERER: 
         - Using negative position so it's not visible to users
         - Must have opacity: 1 and visibility: visible for canvas capture
         - Fixed width in mm to maintain proportions
      */
      #image-source {
        position: absolute;
        top: 0;
        left: -5000px;
        width: 210mm;
        background: white;
        visibility: visible;
        opacity: 1;
        z-index: -999;
      }
    </style>
  <link rel="stylesheet" href="/index.css">

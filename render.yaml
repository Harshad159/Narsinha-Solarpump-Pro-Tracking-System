services:
  - type: web
    name: solarpump-backend
    env: node
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    # CRITICAL: Persistent disk to store SQLite database
    # Mount to /data subdirectory to avoid overwriting server code
    disk:
      name: solarpump-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
